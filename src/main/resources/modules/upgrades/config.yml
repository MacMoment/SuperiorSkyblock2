# Whether the module should be enabled.
# When disabled, all module commands and features will also be disabled.
enabled: true

# Whether crop-growth should be enabled.
# When disabled, the plugin will not alter crop growth.
crop-growth: true

# Whether mob drops should be enabled.
# When disabled, the plugin will not alter mob drops.
mob-drops: true

# Whether island-effects should be enabled.
# When disabled, the plugin will not give any effects to any players.
island-effects: true

# Whether spawner-rates should be enabled.
# When disabled, the plugin will not alter spawner rates.
spawner-rates: true

# Whether block-limits should be enabled.
# When disabled, the plugin will not limit placement of blocks.
block-limits: true

# Whether entity-limits should be enabled.
# When disabled, the plugin will not limit spawning of entities.
entity-limits: true

# Genphoria Custom Upgrades - Using Team Points
# Token Multi: 100 levels, +0.02x per level, 1 point per upgrade
# Money Multi: 100 levels, +0.02x per level, 1 point per upgrade  
# EXP Multi: 100 levels, +0.02x per level, 1 point per upgrade
# Gendrops Speed: Speed boost upgrade, 2 points per upgrade
# Island Size: 125x125 to 250x250, 5 levels, 5 points per level
# Hopper Limit: 50 to 150 per player, 3 levels, 5 points per level
upgrades:
  token-multi:
    '1':
      price: 1.0
      price-type: "teampoints"
      commands:
        - 'island admin setupgrade %player% token-multi 2'
        - 'island admin msgall %player% <#EC8C8C>&lG<#FFC58B>&lE<#FFE295>&lN<#FFFF9E>&lP<#9AFF9A>&lH<#97CFF5>&lO<#9DB5FA>&lR<#A39AFF>&lI<#EEA0FF>&lA &8»&7 Token Multiplier upgraded to Level 2! (+0.04x)'
