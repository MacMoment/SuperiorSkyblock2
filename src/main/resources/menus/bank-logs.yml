title: '<#97CFF5>&lTransaction Logs'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ $ % ! * - ^ $ $'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

time-sort: '!'
money-sort: '-'

items:
  '@':
    type: PAPER
    name: '<#97CFF5>&lTransaction #{0}'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fPlayer: &7{1}'
      - '<#97CFF5>&l| &fStatus: &7{2}'
      - '<#97CFF5>&l| &fTime: &7{3}'
      - '<#97CFF5>&l| &fAmount: &7${4}'
      - '&7'
      - '&8(( &fClick &7to filter by player &8))'
  '%':
    type: ARROW
    name: '<#97CFF5>&lPrevious Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go back &8))'
  '*':
    type: SUNFLOWER
    name: '<#97CFF5>&lCurrent Page'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fPage: &7{0}'
  '^':
    type: ARROW
    name: '<#97CFF5>&lNext Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go forward &8))'
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'
  '!':
    type: CLOCK
    name: '<#97CFF5>&lSort by Time'
    lore:
      - '&7'
      - '&7Sort transactions by creation time.'
      - '&7'
      - '&8(( &fClick &7to sort &8))'
  '-':
    type: EMERALD
    name: '<#97CFF5>&lSort by Amount'
    lore:
      - '&7'
      - '&7Sort transactions by amount.'
      - '&7'
      - '&8(( &fClick &7to sort &8))'

sounds:
  '@':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2