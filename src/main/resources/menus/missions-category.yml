title: '<#97CFF5>&l{0} Missions'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ $ @ @ @ @ @ $ $'
  - '$ $ $ $ $ $ $ $ $'

slots: '@'
previous-page: '*'
current-page: '*'
next-page: '*'

# Should missions be sorted by their completion status?
# Not completed -> Can complete -> Completed
sort-by-completion: false

# Should completed missions not be displayed in the menu?
remove-completed: false

items:
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'

sounds:
  '@':
    locked:
      type: ANVIL_LAND
      volume: 0.2
      pitch: 0.2
    completed:
      type: ANVIL_LAND
      volume: 0.2
      pitch: 0.2
    not-completed:
      type: ANVIL_LAND
      volume: 0.2
      pitch: 0.2
    can-complete:
      type: ORB_PICKUP
      volume: 0.2
      pitch: 0.2