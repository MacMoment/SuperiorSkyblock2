title: '<#97CFF5>&lUnique Visitors ({0})'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ $ % $ * $ ^ $ $'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

items:
  '@':
    type: SKULL_ITEM
    data: 3
    name: '<#97CFF5>&l{0}'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fTeam Owner: &7{1}'
      - '<#97CFF5>&l| &fLast Joined: &7{3}'
      - '&7'
      - '&8(( &fLeft-Click &7to expel &8))'
      - '&8(( &fRight-Click &7to invite &8))'
  '%':
    type: ARROW
    name: '<#97CFF5>&lPrevious Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go back &8))'
  '*':
    type: SUNFLOWER
    name: '<#97CFF5>&lCurrent Page'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fPage: &7{0}'
  '^':
    type: ARROW
    name: '<#97CFF5>&lNext Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go forward &8))'
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'

sounds:
  '@':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2