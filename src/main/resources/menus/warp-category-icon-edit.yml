title: '<#97CFF5>&lCategory: {0}'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ ! $ $ $ $ $ ~ $'
  - '$ $ $ $ ^ $ $ $ $'
  - '$ # $ $ $ $ $ % $'
  - '$ $ $ $ $ $ $ $ $'

icon-type: '!'
icon-rename: '~'
icon-relore: '#'
icon-confirm: '%'
icon-slots: '^'

items:
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'
  '!':
    type: DIAMOND
    name: '<#97CFF5>&lSet Type'
    lore:
      - '&7'
      - '&7Change the item type.'
      - '&7'
      - '&8(( &fClick &7to edit &8))'
  '~':
    type: ANVIL
    name: '<#97CFF5>&lSet Name'
    lore:
      - '&7'
      - '&7Change the item name.'
      - '&7'
      - '&8(( &fClick &7to edit &8))'
  '#':
    type: PAPER
    name: '<#97CFF5>&lSet Lore'
    lore:
      - '&7'
      - '&7Change the item lore.'
      - '&7'
      - '&8(( &fClick &7to edit &8))'
  '%':
    type: EMERALD
    name: '&a&lConfirm Changes'
    lore:
      - '&7'
      - '&7Save all changes to this category.'
      - '&7'
      - '&8(( &fClick &7to confirm &8))'
  '^':
    type: STONE

sounds:
  '%':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2