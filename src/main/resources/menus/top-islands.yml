title: '<#97CFF5>&lTeam Leaderboard'
previous-menu: true

pattern:
  - '~ ~ ~ ~ ~ ~ ~ ~ ~'
  - '@ % @ @ @ # @ @ @'
  - '@ * @ @ # # # @ @'
  - '@ ^ @ # # # # # @'
  - '@ & @ @ @ $ @ @ @'
  - '~ ~ ! ~ - ~ + ~ ~'

slots: '#'
previous-page: '!'
current-page: '-'
next-page: '+'

player-island: '$'
sort-glow-when-selected: true

items:
  '#':
    island:
      type: SKULL_ITEM
      data: 3
      name: '<#97CFF5>&l#{1} &f{0}'
      lore:
        - '&7'
        - '<#97CFF5>&l| &fTeam Statistics'
        - '&7'
        - '<#97CFF5>&l| &fLevel: &7{2}'
        - '<#97CFF5>&l| &fWorth: &7${3}'
        - '<#97CFF5>&l| &fRating: &7{8} ({9})'
        - '<#97CFF5>&l| &fMembers: &7{10}'
        - '&7'
        - '<#97CFF5>&l| &fTeam Members:'
        - '{4}:&7  - &f{}'
        - '&7'
        - '&8(( &fLeft-Click &7to view info &8))'
        - '&8(( &fRight-Click &7to teleport &8))'
    no-island:
      type: SKULL_ITEM
      data: 3
      name: '&7Empty Slot'
  '%':
    type: DIAMOND
    sorting-type: 'WORTH'
    name: '<#97CFF5>&lSort by Worth'
    lore:
      - '&7'
      - '&7Sort teams by total worth value.'
      - '&7'
      - '&8(( &fClick &7to sort &8))'
  '*':
    type: GOLD_INGOT
    sorting-type: 'LEVEL'
    name: '<#97CFF5>&lSort by Level'
    lore:
      - '&7'
      - '&7Sort teams by island level.'
      - '&7'
      - '&8(( &fClick &7to sort &8))'
  '^':
    type: EMERALD
    sorting-type: 'RATING'
    name: '<#97CFF5>&lSort by Rating'
    lore:
      - '&7'
      - '&7Sort teams by average rating.'
      - '&7'
      - '&8(( &fClick &7to sort &8))'
  '&':
    type: SKULL_ITEM
    data: 3
    sorting-type: 'PLAYERS'
    name: '<#97CFF5>&lSort by Players'
    lore:
      - '&7'
      - '&7Sort teams by member count.'
      - '&7'
      - '&8(( &fClick &7to sort &8))'
  '!':
    type: ARROW
    name: '<#97CFF5>&lPrevious Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go back &8))'
  '-':
    type: SUNFLOWER
    name: '<#97CFF5>&lCurrent Page'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fPage: &7{0}'
  '+':
    type: ARROW
    name: '<#97CFF5>&lNext Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go forward &8))'
  '~':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'

sounds:
  '@':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2