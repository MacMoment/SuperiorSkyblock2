title: '<#97CFF5>&lCategory: {0}'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ ! $ $ ~ $ $ # $'
  - '$ $ $ $ $ $ $ $ $'

success-update-sound:
  type: ORB_PICKUP
  volume: 0.2
  pitch: 0.2

category-rename: '!'
category-icon: '~'
category-warps: '#'

items:
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'
  '!':
    type: BOOK
    name: '<#97CFF5>&lRename Category'
    lore:
      - '&7'
      - '&7Change the name of this category.'
      - '&7'
      - '&8(( &fClick &7to rename &8))'
  '~':
    type: STONE
    lore:
      - '&7'
      - '&7Customize the category icon.'
      - '&7'
      - '&7Placeholders:'
      - '&7{0} = warp name'
      - '&7{1} = warp location'
      - '&7{2} = public status'
      - '&7'
      - '&8(( &fRight-Click &7to edit icon &8))'
      - '&8(( &fLeft-Click &7to edit slot &8))'
  '#':
    type: ENDER_PEARL
    name: '<#97CFF5>&lTeam Warps'
    lore:
      - '&7'
      - '&7Manage warps in this category.'
      - '&7'
      - '&8(( &fClick &7to edit warps &8))'