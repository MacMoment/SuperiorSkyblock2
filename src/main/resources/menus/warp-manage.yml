title: '<#97CFF5>&lWarp: {0}'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ $ ! $ % $ # $ $'
  - '$ $ $ $ ~ $ $ $ $'
  - '$ $ $ $ $ $ $ $ $'

success-update-sound:
  type: ORB_PICKUP
  volume: 0.2
  pitch: 0.2

warp-rename: '!'
warp-icon: '~'
warp-location: '#'
warp-private: '%'

items:
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'
  '!':
    type: BOOK
    name: '<#97CFF5>&lRename Warp'
    lore:
      - '&7'
      - '&7Change the name of this warp.'
      - '&7'
      - '&8(( &fClick &7to rename &8))'
  '~':
    type: STONE
    lore:
      - '&7'
      - '&7Customize the warp icon.'
      - '&7'
      - '&7Placeholders:'
      - '&7{0} = warp name'
      - '&7{1} = warp location'
      - '&7{2} = public status'
      - '&7'
      - '&8(( &fClick &7to edit icon &8))'
  '#':
    type: ENDER_PEARL
    name: '<#97CFF5>&lWarp Location'
    lore:
      - '&7'
      - '&7Update the teleport location.'
      - '&7'
      - '&8(( &fClick &7to update &8))'
  '%':
    type: FEATHER
    name: '<#97CFF5>&lPrivate Warp'
    lore:
      - '&7'
      - '&7Toggle warp visibility.'
      - '&7'
      - '&8(( &fClick &7to toggle &8))'