title: '<#97CFF5>&lBlock Counts'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ $ % $ * $ ^ $ $'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

items:
  '@':
    type: STONE
    name: '<#97CFF5>&l{0}'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fQuantity: &7x{1}'
      - '<#97CFF5>&l| &fWorth: &7${2}'
      - '<#97CFF5>&l| &fLevel: &7{3}'
    flags:
      - HIDE_ATTRIBUTES
  '%':
    type: ARROW
    name: '<#97CFF5>&lPrevious Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go back &8))'
  '*':
    type: SUNFLOWER
    name: '<#97CFF5>&lCurrent Page'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fPage: &7{0}'
  '^':
    type: ARROW
    name: '<#97CFF5>&lNext Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go forward &8))'
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'