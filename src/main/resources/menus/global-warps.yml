title: '<#97CFF5>&lTeam Warps'
previous-menu: true

pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ $ % $ * $ ^ $ $'

warps: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

# When enabled, instead of showing warps, the visitor warp locations will be shown.
# To show the description, use the {1} placeholder.
visitor-warps: false

items:
  '@':
    type: SKULL_ITEM
    data: 3
    name: '<#97CFF5>&l{0}''s Team'
    lore:
      - '&7'
      - '&7Click to see all warps of this team.'
      - '&7'
      - '<#97CFF5>&l| &fWarps: &7{2}'
  '%':
    type: ARROW
    name: '<#97CFF5>&lPrevious Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go back &8))'
  '*':
    type: SUNFLOWER
    name: '<#97CFF5>&lCurrent Page'
    lore:
      - '&7'
      - '<#97CFF5>&l| &fPage: &7{0}'
  '^':
    type: ARROW
    name: '<#97CFF5>&lNext Page'
    lore:
      - '&7'
      - '&8(( &fClick &7to go forward &8))'
  '$':
    type: GRAY_STAINED_GLASS_PANE
    name: '&7'

sounds:
  '@':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2